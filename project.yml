name: MDWriter

options:
  bundleIdPrefix: listentotherain
  deploymentTarget:
    macOS: "14.0"

settings:
  MARKETING_VERSION: 3.0.0
  CURRENT_PROJECT_VERSION: 300
  SWIFT_VERSION: 6.0

packages:
  MDEditorKit:
    url: https://github.com/SteveShi/MDEditorKit.git
    from: 2.1.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.4
  MCP:
    url: https://github.com/modelcontextprotocol/swift-sdk.git
    from: 0.12.1
targets:
  MDWriter:
    type: application
    platform: macOS
    sources:
      - path: MDWriter
    resources:
      - path: MDWriter/Assets.xcassets
      - path: MDWriter/Resources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: listentotherain.MDWriter
      INFOPLIST_FILE: MDWriter/App/Info.plist
      ENABLE_APP_SANDBOX: NO
      GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: MDEditorKit
        product: MDEditorKit
      - package: Sparkle
        product: Sparkle
      - package: MCP
        product: MCP

schemes:
  MDWriter:
    build:
      targets:
        MDWriter: all
