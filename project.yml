name: MDWriter

options:
  bundleIdPrefix: listentotherain
  deploymentTarget:
    macOS: "14.0"

settings:
  MARKETING_VERSION: 3.2.1
  CURRENT_PROJECT_VERSION: 321
  SWIFT_VERSION: 6.0

packages:
  MDEditorKit:
    url: https://github.com/SteveShi/MDEditorKit.git
    from: 2.1.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.4
  MCP:
    url: https://github.com/modelcontextprotocol/swift-sdk.git
    from: 0.12.1
targets:
  MDWriter:
    type: application
    platform: macOS
    sources:
      - path: MDWriter
    resources:
      - path: MDWriter/Assets.xcassets
    dependencies:
      - package: MDEditorKit
      - package: Sparkle
      - package: MCP
    settings:
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_FILE: MDWriter/App/Info.plist
      PRODUCT_BUNDLE_IDENTIFIER: listentotherain.MDWriter
      COMBINE_HIDPI_IMAGES: YES
      ENABLE_HARDENED_RUNTIME: YES
      OTHER_LDFLAGS:
        - -framework
        - Sparkle
      FRAMEWORK_SEARCH_PATHS:
        - $(inherited)
        - $(PROJECT_DIR)/MDWriter/Core/Integrations
